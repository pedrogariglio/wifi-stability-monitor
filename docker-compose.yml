version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: wifi-backend
    ports:
      - "8088:8088"
    volumes:
      - /var/log/wifi-metrics.csv:/var/log/wifi-metrics.csv:ro
      - ./dashboard/main.py:/app/main.py
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    container_name: wifi-dashboard
    ports:
      - "8090:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  metrics:
    build:
      context: .
      dockerfile: docker/metrics/Dockerfile
    container_name: wifi-metrics
    network_mode: host
    volumes:
      - /var/log/wifi-metrics.csv:/var/log/wifi-metrics.csv
    environment:
      - TZ=America/Argentina/Buenos_Aires
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "[ $(($(date +%s) - $(date +%s -r /var/log/wifi-metrics.csv))) -lt 120 ]"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
